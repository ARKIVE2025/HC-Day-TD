<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hustler's Cabin | A Private Wealth Assembly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #080808;
      --gold-primary: #d4af37;
      --gold-light: #f5e7a9;
      --gold-dark: #8c6d23;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: #eaeaea;
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.1) 0%, transparent 70%),
        linear-gradient(to bottom, #050505, #0a0a0a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
      text-align: center;
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .seal-badge {
      width: 80px;
      height: 80px;
      margin: 0 auto 28px;
      border: 2px solid var(--gold-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 700;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
    }

    .eyebrow {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold-light);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="seal-badge gold-gradient-text">H</div>
      <p class="eyebrow">Exclusive Summons</p>
      <h1 class="gold-gradient-text">Hustler's Cabin</h1>
      <p class="subtitle">A Private Wealth Assembly</p>
    </header>
  </div>

</body>
</html>
